services:
  - type: web
    name: enigma-crush-backend
    env: node
    plan: free
    region: oregon
    branch: develop
    
    # Environment variables
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: enigma-crush-db
          property: connectionString
      - key: FRONTEND_URL
        value: "https://enigma-crush-frontend.vercel.app"
      - key: JWT_SECRET
        generateValue: true
    
    # Build settings
    buildCommand: npm install
    
    # Start command
    startCommand: npm start
    
    # Auto-deploy settings
    autoDeploy: true

databases:
  - name: enigma-crush-db
    databaseName: enigma_crush
    user: enigma_user
    plan: free
    region: oregon
    version: "15"
    
    # Database settings
    ipAllowList: []
    
    # Backup settings
    backup:
      enabled: true
      schedule: "0 2 * * *"  # Daily at 2 AM
      retention: 7  # Keep 7 days of backups