name: Deploy to Development Environment

on:
  push:
    branches: [ develop ]
    paths:
      - 'enigma-crush-backend/**'
      - '.github/workflows/dev-deploy.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  BACKEND_DIR: './'

jobs:
  # Job 1: Testes do Backend
  backend-tests:
    name: Ì∑™ Backend Tests (Dev)
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: enigma_crush_dev_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Ì≥• Checkout code
        uses: actions/checkout@v4
      
      - name: Ìø¢ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Ì≥¶ Install dependencies
        run: npm ci
      
      - name: Ì¥ß Setup test environment
        run: |
          cp .env.development .env.test
          echo "DATABASE_URL=postgresql://test_user:test_password@localhost:5432/enigma_crush_dev_test" >> .env.test
      
      - name: Ì∑ÑÔ∏è Run database migrations
        run: |
          npx prisma generate
          npx prisma db push
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/enigma_crush_dev_test
      
      - name: Ì∑™ Run tests
        run: npm run test:ci
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/enigma_crush_dev_test
      
      - name: Ì≥ä Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: backend
          name: backend-coverage

  # Job 2: Deploy para Render (Dev)
  deploy-backend-dev:
    name: ÔøΩÔøΩ Deploy Backend to Render (Dev)
    runs-on: ubuntu-latest
    needs: backend-tests
    if: github.ref == 'refs/heads/develop'
    
    steps:
      - name: Ì≥• Checkout code
        uses: actions/checkout@v4
      
      - name: Ì∫Ä Deploy to Render (Dev)
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID_DEV }}
          api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-success: true

  # Job 3: Valida√ß√£o p√≥s-deploy
  validate-deployment:
    name: ‚úÖ Validate Development Deployment
    runs-on: ubuntu-latest
    needs: deploy-backend-dev
    
    steps:
      - name: Ì≥• Checkout code
        uses: actions/checkout@v4
      
      - name: Ìø¢ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Ì≥¶ Install dependencies
        run: npm ci
      
      - name: Ì¥ç Health Check
        run: |
          sleep 30  # Aguarda o servi√ßo inicializar
          node scripts/health-check.js
        env:
          API_URL: https://enigma-crush-backend-dev.onrender.com
      
      - name: Ì∑™ Run production validation
        run: node scripts/validate-production.js
        env:
          API_URL: https://enigma-crush-backend-dev.onrender.com
          NODE_ENV: development
