name: Deploy to Development Environment

on:
  push:
    branches: [ develop ]
    paths:
      - 'enigma-crush-backend/**'
      - '.github/workflows/dev-deploy.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  BACKEND_DIR: './'

jobs:
  # Job 1: Testes do Backend
  backend-tests:
    name: ��� Backend Tests (Dev)
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: enigma_crush_dev_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: ��� Checkout code
        uses: actions/checkout@v4
      
      - name: ��� Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: ��� Install dependencies
        run: npm ci
      
      - name: ��� Setup test environment
        run: |
          cp .env.development .env.test
          echo "DATABASE_URL=postgresql://test_user:test_password@localhost:5432/enigma_crush_dev_test" >> .env.test
      
      - name: ���️ Run database migrations
        run: |
          npx prisma generate
          npx prisma db push
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/enigma_crush_dev_test
      
      - name: ��� Run tests
        run: npm run test:ci
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/enigma_crush_dev_test
      
      - name: ��� Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: backend
          name: backend-coverage

  # Job 2: Deploy para Render (Dev)
  deploy-backend-dev:
    name: �� Deploy Backend to Render (Dev)
    runs-on: ubuntu-latest
    needs: backend-tests
    if: github.ref == 'refs/heads/develop'
    
    steps:
      - name: ��� Checkout code
        uses: actions/checkout@v4
      
      - name: ��� Deploy to Render (Dev)
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID_DEV }}
          api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-success: true

  # Job 3: Validação pós-deploy
  validate-deployment:
    name: ✅ Validate Development Deployment
    runs-on: ubuntu-latest
    needs: deploy-backend-dev
    
    steps:
      - name: ��� Checkout code
        uses: actions/checkout@v4
      
      - name: ��� Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: ��� Install dependencies
        run: npm ci
      
      - name: ��� Health Check
        run: |
          sleep 30  # Aguarda o serviço inicializar
          node scripts/health-check.js
        env:
          API_URL: https://app-enigma-backend.onrender.com/api
      
      - name: ��� Run production validation
        run: node scripts/validate-production.js
        env:
          API_URL: https://app-enigma-backend.onrender.com/api
          NODE_ENV: development
