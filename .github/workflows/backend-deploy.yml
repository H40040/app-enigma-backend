name: Backend Deploy to Render

on:
  push:
    branches: [ main, master ]
    paths:
      - 'enigma-crush-backend/**'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'enigma-crush-backend/**'
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  BACKEND_DIR: './enigma-crush-backend'

jobs:
  # Job 1: Testes do Backend
  backend-tests:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: enigma_crush_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.BACKEND_DIR }}/package-lock.json
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🔧 Setup test environment
        run: |
          cp .env.test .env
          echo "DATABASE_URL=postgresql://test_user:test_password@localhost:5432/enigma_crush_test" >> .env
      
      - name: 🗄️ Setup test database
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx prisma db seed
      
      - name: 🧪 Run tests
        run: npm test
      
      - name: 📊 Upload test coverage
        uses: codecov/codecov-action@v3
        with:
          file: ${{ env.BACKEND_DIR }}/coverage/lcov.info
          flags: backend
          name: backend-coverage

  # Job 2: Lint e Auditoria de Segurança
  code-quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.BACKEND_DIR }}/package-lock.json
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🔍 Run ESLint
        run: npm run lint
      
      - name: 🛡️ Security audit
        run: npm audit --audit-level=moderate
      
      - name: 🔒 Check for vulnerabilities
        run: npx audit-ci --moderate

  # Job 3: Build Docker Image
  docker-build:
    name: 🐳 Docker Build Test
    runs-on: ubuntu-latest
    needs: [backend-tests, code-quality]
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 🏗️ Build Docker image
        run: |
          docker build -t enigma-crush-backend:test .
      
      - name: 🧪 Test Docker container
        run: |
          docker run --rm -d --name test-container \
            -e NODE_ENV=test \
            -e PORT=4006 \
            -e DATABASE_URL="postgresql://test:test@localhost:5432/test" \
            -p 4006:4006 \
            enigma-crush-backend:test
          
          # Wait for container to start
          sleep 10
          
          # Test health endpoint
          curl -f http://localhost:4006/health || exit 1
          
          # Stop container
          docker stop test-container

  # Job 4: Deploy to Render (apenas em push para main/master)
  deploy-render:
    name: 🚀 Deploy to Render
    runs-on: ubuntu-latest
    needs: [backend-tests, code-quality, docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🚀 Deploy to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
      
      - name: ⏳ Wait for deployment
        run: |
          echo "Waiting for deployment to complete..."
          sleep 60

  # Job 5: Testes de Integração Pós-Deploy
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: [deploy-render]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: 🏥 Health Check
        run: |
          curl -f ${{ secrets.BACKEND_URL }}/health || exit 1
          echo "✅ Health check passed"
      
      - name: 🔐 Test Authentication Endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.BACKEND_URL }}/api/auth/login)
          if [ $response -eq 200 ] || [ $response -eq 400 ] || [ $response -eq 401 ]; then
            echo "✅ Auth endpoint responding correctly"
          else
            echo "❌ Auth endpoint failed with status: $response"
            exit 1
          fi
      
      - name: 🗄️ Test Database Connection
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.BACKEND_URL }}/api/users/me)
          if [ $response -eq 401 ] || [ $response -eq 403 ]; then
            echo "✅ Database connection working (auth required as expected)"
          else
            echo "❌ Unexpected response from protected endpoint: $response"
            exit 1
          fi

  # Job 6: Performance Tests
  performance-tests:
    name: ⚡ Performance Tests
    runs-on: ubuntu-latest
    needs: [integration-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: 📦 Install Artillery
        run: npm install -g artillery@latest
      
      - name: ⚡ Load Test
        run: |
          cat > load-test.yml << EOF
          config:
            target: '${{ secrets.BACKEND_URL }}'
            phases:
              - duration: 60
                arrivalRate: 5
                name: "Warm up"
              - duration: 120
                arrivalRate: 10
                name: "Load test"
          scenarios:
            - name: "Health check"
              weight: 50
              flow:
                - get:
                    url: "/health"
            - name: "API endpoints"
              weight: 50
              flow:
                - get:
                    url: "/api/auth/login"
          EOF
          
          artillery run load-test.yml

  # Job 7: Notificações
  notify:
    name: 📢 Notifications
    runs-on: ubuntu-latest
    needs: [deploy-render, integration-tests, performance-tests]
    if: always()
    
    steps:
      - name: 📢 Notify Success
        if: needs.deploy-render.result == 'success' && needs.integration-tests.result == 'success'
        run: |
          echo "✅ Backend deployment successful!"
          echo "🚀 Backend URL: ${{ secrets.BACKEND_URL }}"
          echo "📊 All tests passed"
      
      - name: 📢 Notify Failure
        if: needs.deploy-render.result == 'failure' || needs.integration-tests.result == 'failure'
        run: |
          echo "❌ Backend deployment failed!"
          echo "🔍 Check the logs for details"
          exit 1

  # Job 8: Cleanup
  cleanup:
    name: 🧹 Cleanup
    runs-on: ubuntu-latest
    needs: [notify]
    if: always()
    
    steps:
      - name: 🧹 Clean up artifacts
        run: |
          echo "🧹 Cleaning up temporary files and artifacts"
          # Add any cleanup commands here if needed
          echo "✅ Cleanup completed"